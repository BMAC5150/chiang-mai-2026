<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3E3460">
<title>Chiang Mai 2026</title>
<meta name="description" content="Chiang Mai 2026 — the trip guide.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,30..100;1,9..144,400..600,30..100&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#8B7EC8; --violet-deep:#5D4E8C; --aubergine:#3E3460;
    --lav-bg:#F4F1FA;
    --gold:#C9A24B; --gold-deep:#A8842E; --gold-soft:#E6D2A0;
    --ink:#2E2A3A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background:var(--lav-bg);
    background-image:
      radial-gradient(120% 60% at 85% -5%, rgba(139,126,200,.34), transparent 60%),
      radial-gradient(90% 50% at 0% 8%, rgba(201,162,75,.14), transparent 55%),
      radial-gradient(80% 60% at 50% 110%, rgba(93,78,140,.24), transparent 60%);
    background-attachment:fixed;
    padding:22px 20px 40px;min-height:100vh;position:relative;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"kern","liga","calt","ss01";
  }
  /* Noise film */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.42;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .24  0 0 0 0 .20  0 0 0 0 .38  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* Signature orchid mark behind the grid */
  body::after{
    content:"";position:fixed;left:50%;top:50%;width:560px;height:560px;transform:translate(-50%,-50%);
    pointer-events:none;z-index:0;opacity:.055;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' fill='none' stroke='%235D4E8C' stroke-width='.6'><g transform='translate(100 100)'><ellipse rx='58' ry='19' transform='rotate(20)'/><ellipse rx='58' ry='19' transform='rotate(80)'/><ellipse rx='58' ry='19' transform='rotate(140)'/><ellipse rx='58' ry='19' transform='rotate(200)'/><ellipse rx='58' ry='19' transform='rotate(260)'/><ellipse rx='58' ry='19' transform='rotate(320)'/><circle r='14' fill='%23C9A24B' fill-opacity='.5' stroke='none'/></g></svg>") center/contain no-repeat;
  }

  .grid{
    position:relative;z-index:1;
    max-width:460px;margin:0 auto;
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
  }

  /* ---------- Tile base ---------- */
  .tile{
    position:relative;display:block;text-decoration:none;color:inherit;
    aspect-ratio:1 / 1;
    border-radius:22px;overflow:hidden;
    box-shadow:0 14px 34px -16px rgba(30,20,50,.42), 0 2px 6px -3px rgba(30,20,50,.20);
    isolation:isolate;
    transition:transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s;
    opacity:0;transform:translateY(10px);
    animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .tile:nth-child(1){animation-delay:.04s;} .tile:nth-child(2){animation-delay:.08s;}
  .tile:nth-child(3){animation-delay:.12s;} .tile:nth-child(4){animation-delay:.16s;}
  .tile:nth-child(5){animation-delay:.20s;} .tile:nth-child(6){animation-delay:.24s;}
  .tile:nth-child(7){animation-delay:.28s;} .tile:nth-child(8){animation-delay:.32s;}
  .tile:nth-child(9){animation-delay:.36s;}

  .tile:hover{transform:translateY(-4px);box-shadow:0 22px 46px -18px rgba(30,20,50,.55), 0 3px 8px -3px rgba(30,20,50,.24);}
  .tile:active{transform:translateY(-1px) scale(.985);}

  /* Motif layer — fills entire tile */
  .motif{
    position:absolute;inset:0;pointer-events:none;z-index:1;
    background-repeat:no-repeat;
  }

  /* Name typography */
  .name{
    position:absolute;left:20px;right:20px;bottom:18px;z-index:3;
    font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;
    line-height:.98;letter-spacing:-.02em;
    font-variation-settings:"opsz" 96,"SOFT" 60;
  }
  .name em{
    display:block;font-style:italic;font-weight:500;
    font-size:.62em;margin-top:5px;letter-spacing:-.012em;
    font-variation-settings:"opsz" 72,"SOFT" 100;
  }

  /* Wide tile — Elephants closer */
  .tile.wide{grid-column:1 / -1;aspect-ratio:2.15 / 1;}
  .tile.wide .name{font-size:36px;left:24px;bottom:20px;}
  .tile.wide .name em{font-size:.5em;margin-top:6px;}

  @keyframes rise{to{opacity:1;transform:none;}}

  /* ============================================================
     TILE 1 — TRAVEL   deep violet transpacific sky + contrails
  ============================================================ */
  .t-travel{background:linear-gradient(155deg,#6b5aa0 0%,#3E3460 55%,#241d40 100%);color:#F0EAFF;}
  .t-travel .motif{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23E6D2A0' stroke-width='.4' stroke-linecap='round' stroke-opacity='.72'><path d='M-8 82 Q42 22 108 30' stroke-dasharray='1.2 2.8'/><path d='M-8 92 Q46 36 108 44' stroke-dasharray='1.2 2.8' stroke-opacity='.65'/><path d='M-8 70 Q38 12 108 16' stroke-dasharray='1.2 2.8' stroke-opacity='.55'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g transform='translate(12 12) rotate(-32) translate(-12 -12)' fill='%23F0E6C8'><path d='M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z'/></g></svg>");
    background-size:100% 100%, 62% 62%;
    background-position:center, 68% 30%;
    background-repeat:no-repeat, no-repeat;
  }
  .t-travel .name em{color:var(--gold-soft);}

  /* ============================================================
     TILE 2 — WEDDING   aubergine + gold orchid
  ============================================================ */
  .t-wedding{background:
    radial-gradient(60% 50% at 80% 0%,rgba(201,162,75,.55),transparent 60%),
    radial-gradient(50% 40% at 10% 100%,rgba(139,126,200,.55),transparent 60%),
    linear-gradient(155deg,#4a3e74 0%,#3E3460 55%,#2c2547 100%);
    color:#fff;
  }
  .t-wedding .motif{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='translate(50 52)'><g fill='%23F5EBD3' fill-opacity='.9' stroke='%23E6D2A0' stroke-width='.35' stroke-opacity='.55'><path d='M 0 -6 Q -8 -14 -10 -22 Q -6 -30 0 -30 Q 6 -30 10 -22 Q 8 -14 0 -6 Z'/><path d='M 0 -6 Q -8 -14 -10 -22 Q -6 -30 0 -30 Q 6 -30 10 -22 Q 8 -14 0 -6 Z' transform='rotate(72)'/><path d='M 0 -6 Q -8 -14 -10 -22 Q -6 -30 0 -30 Q 6 -30 10 -22 Q 8 -14 0 -6 Z' transform='rotate(144)'/><path d='M 0 -6 Q -8 -14 -10 -22 Q -6 -30 0 -30 Q 6 -30 10 -22 Q 8 -14 0 -6 Z' transform='rotate(216)'/><path d='M 0 -6 Q -8 -14 -10 -22 Q -6 -30 0 -30 Q 6 -30 10 -22 Q 8 -14 0 -6 Z' transform='rotate(288)'/></g><g fill='none' stroke='%23A8842E' stroke-width='.5' stroke-opacity='.55'><path d='M 0 -8 Q -3 -16 -3 -24' transform='rotate(0)'/><path d='M 0 -8 Q -3 -16 -3 -24' transform='rotate(72)'/><path d='M 0 -8 Q -3 -16 -3 -24' transform='rotate(144)'/><path d='M 0 -8 Q -3 -16 -3 -24' transform='rotate(216)'/><path d='M 0 -8 Q -3 -16 -3 -24' transform='rotate(288)'/></g><circle r='7' fill='%23C9A24B'/><circle r='4' fill='%23A8842E'/><circle r='1.8' fill='%23E6D2A0'/></g></svg>");
    background-size:100% 100%;
  }
  .t-wedding .name em{color:#E6D2A0;}

  /* ============================================================
     TILE 3 — MONEY   deep emerald + guilloché + ฿
  ============================================================ */
  .t-money{background:linear-gradient(155deg,#2b7e6b 0%,#1F6B5A 45%,#0e3830 100%);color:#F1F5EE;}
  .t-money .motif{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23DFC395' stroke-width='.3' opacity='.32'><g transform='translate(50 52)'><ellipse rx='44' ry='14'/><ellipse rx='44' ry='14' transform='rotate(30)'/><ellipse rx='44' ry='14' transform='rotate(60)'/><ellipse rx='44' ry='14' transform='rotate(90)'/><ellipse rx='44' ry='14' transform='rotate(120)'/><ellipse rx='44' ry='14' transform='rotate(150)'/></g></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='translate(50 54) rotate(-10)'><rect x='-34' y='-18' width='68' height='36' rx='2.5' fill='%23F1E1B8' fill-opacity='.14' stroke='%23F0DFB2' stroke-width='.7'/><rect x='-30' y='-14' width='60' height='28' rx='1.5' fill='none' stroke='%23F0DFB2' stroke-width='.35' stroke-dasharray='1 1.6' stroke-opacity='.7'/><circle cx='0' cy='0' r='11' fill='%23F0DFB2' fill-opacity='.14' stroke='%23F0DFB2' stroke-width='.6'/><text x='0' y='4.6' text-anchor='middle' font-family='Georgia' font-size='16' font-weight='700' fill='%23F1E1B8' fill-opacity='.95'>฿</text><g fill='%23F0DFB2' fill-opacity='.85' font-family='Georgia' font-size='4.6' font-weight='700'><text x='-30.5' y='-9.5'>1000</text><text x='30.5' y='14' text-anchor='end'>1000</text></g><path d='M-30 3 L-22 3 M-30 5 L-24 5' stroke='%23F0DFB2' stroke-width='.35' stroke-opacity='.6'/><path d='M22 -5 L30 -5 M24 -3 L30 -3' stroke='%23F0DFB2' stroke-width='.35' stroke-opacity='.6'/></g></svg>");
    background-size:100% 100%, 100% 100%;
  }
  .t-money .name em{color:#DFC395;}

  /* ============================================================
     TILE 4 — FOOD   warm cream to amber + bowl + chili
  ============================================================ */
  .t-food{background:linear-gradient(155deg,#FBEEDF 0%,#F5D8A8 55%,#E9B074 100%);color:#3E1E14;}
  .t-food .motif{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'><g><path d='M28 40 q4 -10 8 0' stroke='%23B24C3A' stroke-opacity='.55' stroke-width='.9' stroke-linecap='round'/><path d='M44 32 q4 -12 8 0' stroke='%23B24C3A' stroke-opacity='.55' stroke-width='.9' stroke-linecap='round'/><path d='M60 32 q4 -12 8 0' stroke='%23B24C3A' stroke-opacity='.55' stroke-width='.9' stroke-linecap='round'/><path d='M76 40 q4 -10 8 0' stroke='%23B24C3A' stroke-opacity='.55' stroke-width='.9' stroke-linecap='round'/><path d='M18 55 Q50 82 82 55 L82 55 Z' fill='%23B24C3A' fill-opacity='.9'/><ellipse cx='50' cy='55' rx='34' ry='4' fill='%237E3820' fill-opacity='.85'/></g><g transform='translate(76 74) rotate(30)'><path d='M0 0 q-3 -3 -7 -4 t-4 -6' stroke='%237E3820' stroke-width='1' stroke-linecap='round' fill='none'/><path d='M0 0 q6 -1 8 -4 q4 6 -2 10 q-4 3 -6 -6 Z' fill='%23B24C3A'/></g></svg>");
    background-size:100% 100%;
  }
  .t-food .name{color:#3E1E14;}
  .t-food .name em{color:#B24C3A;font-style:italic;}

  /* ============================================================
     TILE 5 — COOKING   terracotta + wok rings + mortar corner
  ============================================================ */
  .t-cooking{background:linear-gradient(155deg,#c5674a 0%,#B0553A 45%,#6E301B 100%);color:#F7EED6;}
  .t-cooking .motif{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23F7EED6' stroke-width='.35' stroke-opacity='.42'><g transform='translate(50 52)'><circle r='12'/><circle r='20'/><circle r='28'/><circle r='36'/><circle r='44'/><circle r='52'/></g></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='translate(50 52)'><g transform='rotate(22)'><rect x='-1.6' y='-30' width='3.2' height='20' rx='1.4' fill='%23F7EED6'/><ellipse cx='0' cy='-11' rx='3.4' ry='2.6' fill='%23F7EED6'/></g><path d='M-24 -2 L-20 22 Q0 30 20 22 L24 -2 Z' fill='%23F7EED6' fill-opacity='.85'/><ellipse cx='0' cy='-2' rx='24' ry='4.6' fill='%237E3820' fill-opacity='.55'/><ellipse cx='0' cy='-2' rx='24' ry='4.6' fill='none' stroke='%23F7EED6' stroke-width='.5'/><circle cx='-6' cy='-2' r='1.3' fill='%23B0553A'/><circle cx='4' cy='0' r='1.1' fill='%23B0553A'/><circle cx='-1' cy='1.5' r='1' fill='%23B0553A'/><circle cx='7' cy='-1' r='.9' fill='%23B0553A'/><path d='M-22 22 Q0 30 22 22 Q22 24 0 32 Q-22 24 -22 22 Z' fill='%23F7EED6' fill-opacity='.35'/></g></svg>");
    background-size:100% 100%, 100% 100%;
  }
  .t-cooking .name em{color:#E5C4B4;}

  /* ============================================================
     TILE 6 — MARKETS   midnight + lantern string + glow
  ============================================================ */
  .t-markets{background:
    radial-gradient(60% 45% at 50% 30%,#3C315E 0%,transparent 62%),
    linear-gradient(180deg,#1E1A3E 0%,#0e0a26 100%);
    color:#FFF3C4;
  }
  .t-markets .motif{
    background-image:
      radial-gradient(circle at 18% 32%, rgba(244,183,64,.55) 0%, rgba(244,183,64,0) 6%),
      radial-gradient(circle at 40% 24%, rgba(247,212,140,.55) 0%, rgba(247,212,140,0) 6%),
      radial-gradient(circle at 60% 28%, rgba(244,183,64,.55) 0%, rgba(244,183,64,0) 6%),
      radial-gradient(circle at 82% 22%, rgba(247,212,140,.55) 0%, rgba(247,212,140,0) 6%),
      radial-gradient(circle at 30% 58%, rgba(244,183,64,.45) 0%, rgba(244,183,64,0) 5%),
      radial-gradient(circle at 70% 62%, rgba(247,212,140,.45) 0%, rgba(247,212,140,0) 5%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'><path d='M-4 18 Q50 8 104 18' stroke='%23F4B740' stroke-opacity='.42' stroke-width='.4' stroke-dasharray='1 2'/><g fill='%23F4B740' fill-opacity='.75'><ellipse cx='18' cy='32' rx='3.2' ry='4.6'/><ellipse cx='40' cy='24' rx='3.2' ry='4.6'/><ellipse cx='60' cy='28' rx='3.2' ry='4.6'/><ellipse cx='82' cy='22' rx='3.2' ry='4.6'/></g><g stroke='%23F4B740' stroke-opacity='.7' stroke-width='.5'><path d='M18 27v-6M40 19v-6M60 23v-6M82 17v-6'/></g><g fill='%23F4B740' fill-opacity='.6'><ellipse cx='30' cy='58' rx='2.4' ry='3.4'/><ellipse cx='70' cy='62' rx='2.4' ry='3.4'/></g></svg>");
    background-size:auto,auto,auto,auto,auto,auto,100% 100%;
  }
  .t-markets .name{color:#FFF3C4;}
  .t-markets .name em{color:#F4B740;}

  /* ============================================================
     TILE 7 — TEMPLES   gold ochre + chedi silhouette
  ============================================================ */
  .t-temples{background:linear-gradient(160deg,#FBEED0 0%,#E9CE8A 55%,#B98D2A 100%);color:#5B3A1F;}
  .t-temples .motif{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%235B3A1F' fill-opacity='.42' stroke='%235B3A1F' stroke-opacity='.55' stroke-width='.5' stroke-linejoin='round'><g><line x1='50' y1='8' x2='50' y2='18' stroke-width='.7'/><circle cx='50' cy='6' r='1.4' stroke='none'/><path d='M46 20 L50 15 L54 20 L52.5 26 L47.5 26 Z'/><path d='M44 27.5 L56 27.5 L54.5 35 L45.5 35 Z'/><path d='M41 36.5 L59 36.5 L57.5 47 L42.5 47 Z'/><path d='M37 49 L63 49 L61.5 63 L38.5 63 Z'/><path d='M31 65 L69 65 L67 81 L33 81 Z'/><path d='M25 83 L75 83 L75 92 L25 92 Z'/></g></svg>");
    background-size:100% 100%;
    background-position:center 4%;
  }
  .t-temples .name em{color:#8F6D18;}

  /* ============================================================
     TILE 8 — HIKES   forest + contour lines + ridge
  ============================================================ */
  .t-hikes{background:linear-gradient(155deg,#6ea583 0%,#3A5E48 55%,#22382a 100%);color:#EAF0EC;}
  .t-hikes .motif{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'><path d='M0 60 L14 34 L28 52 L42 30 L58 48 L72 32 L88 50 L100 40 L100 100 L0 100 Z' fill='%23DCEBE1' fill-opacity='.14'/><path d='M0 74 L12 52 L26 68 L40 44 L54 62 L68 48 L82 66 L100 52 L100 100 L0 100 Z' fill='%23DCEBE1' fill-opacity='.24'/><path d='M0 88 L18 58 L32 76 L50 34 L68 72 L82 58 L100 82 L100 100 L0 100 Z' fill='%23DCEBE1' fill-opacity='.38'/><path d='M45 46 L50 34 L55 44 L53 46 L50 41 L47 46 Z' fill='%23ffffff' fill-opacity='.85'/><g stroke='%23DCEBE1' stroke-width='.55' stroke-linejoin='round' stroke-opacity='.55'><path d='M18 88 L36 62 L28 62'/><path d='M50 34 L58 46 L68 44'/></g><path d='M22 92 Q34 80 44 66 Q46 60 50 54' stroke='%23F7EED6' stroke-width='.7' stroke-dasharray='1.4 1.8' fill='none' stroke-opacity='.85' stroke-linecap='round'/><circle cx='22' cy='92' r='1.1' fill='%23F7EED6' fill-opacity='.9'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23DCEBE1' stroke-width='.28' stroke-opacity='.32'><path d='M-10 20 Q30 10 50 20 T110 20'/><path d='M-10 26 Q30 16 50 26 T110 26'/><path d='M-10 14 Q30 4 50 14 T110 14'/></svg>");
    background-size:100% 100%, 100% 100%;
  }
  .t-hikes .name em{color:#C9E1D8;}

  /* ============================================================
     TILE 9 — SPAS (WIDE)   dusty teal + lotus + steam
  ============================================================ */
  .t-spas{background:linear-gradient(105deg,#8FB7B0 0%,#5C8A85 55%,#3E635E 100%);color:#F5EBDD;}
  .t-spas .motif{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100' fill='none' stroke='%23F5EBDD' stroke-width='1.4' stroke-linecap='round' stroke-opacity='.55'><path d='M 130 8 Q 124 22 132 34 Q 140 46 132 58'/><path d='M 158 4 Q 152 18 160 30 Q 168 42 160 54'/><path d='M 186 10 Q 180 24 188 36 Q 196 48 188 60'/></svg>"),
      url("assets/lotus.svg");
    background-size:auto 90%, auto 62%;
    background-position:right 12px center, right 22px center;
    background-repeat:no-repeat, no-repeat;
  }
  .t-spas .name{color:#FFF;}
  .t-spas .name em{color:#F0DFB2;font-style:italic;}

  @media (max-width:360px){
    .tile{border-radius:18px;}
    .name{font-size:22px;left:16px;right:16px;bottom:14px;}
    .tile.wide .name{font-size:28px;}
  }
</style>
</head>
<body>

  <main class="grid">

    <a class="tile t-travel" href="travel.html" aria-label="Travel">
      <div class="motif"></div>
      <div class="name">Travel<em>&amp; Stay</em></div>
    </a>

    <a class="tile t-wedding" href="wedding.html" aria-label="Wedding">
      <div class="motif"></div>
      <div class="name">Wedding<em>Day</em></div>
    </a>

    <a class="tile t-money" href="money.html" aria-label="Money">
      <div class="motif"></div>
      <div class="name">Money</div>
    </a>

    <a class="tile t-food" href="food.html" aria-label="Food and Coffee">
      <div class="motif"></div>
      <div class="name">Food<em>&amp; Coffee</em></div>
    </a>

    <a class="tile t-cooking" href="cooking.html" aria-label="Cooking">
      <div class="motif"></div>
      <div class="name">Cooking<em>Schools</em></div>
    </a>

    <a class="tile t-markets" href="markets.html" aria-label="Markets">
      <div class="motif"></div>
      <div class="name">Night<em>Markets</em></div>
    </a>

    <a class="tile t-temples" href="temples.html" aria-label="Temples">
      <div class="motif"></div>
      <div class="name">Temples<em>&amp; Chedis</em></div>
    </a>

    <a class="tile t-hikes" href="hikes.html" aria-label="Hikes">
      <div class="motif"></div>
      <div class="name">Hikes<em>&amp; Waterfalls</em></div>
